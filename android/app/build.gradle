plugins {
    id "com.android.application"
}

android {
    namespace "qc.meridien.app"
    compileSdk 34

    defaultConfig {
        applicationId "qc.meridien.app"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2.0"
    }

    signingConfigs {
        release {
            storeFile file("${rootDir}/meridien-release.keystore")
            storePassword "meridien"
            keyAlias "meridien"
            keyPassword "meridien"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
